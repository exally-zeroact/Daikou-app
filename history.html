<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>本日の履歴</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f5f5;color:#111;min-height:100vh;}

.appbar{
  background:#007AFF;
  padding:12px 16px;
  padding-top:max(12px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:12px;
}
.appbar-back{
  color:#fff;font-size:20px;cursor:pointer;
  padding:4px 8px;
  transition:transform 0.1s,filter 0.1s;
}
.appbar-back:active{transform:scale(0.9);filter:brightness(0.8);}
.appbar-title{font-size:17px;font-weight:700;color:#fff;}

.wrap{padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:40px;}

/* 日付ヘッダー */
.date-header{
  font-size:13px;font-weight:700;color:#8E8E93;
  letter-spacing:1px;padding:4px 0;
}

/* サマリーカード */
.summary-card{
  background:#fff;border-radius:12px;
  padding:16px;display:grid;
  grid-template-columns:1fr 1fr 1fr;gap:8px;
}
.summary-item{text-align:center;}
.summary-label{font-size:11px;color:#aaa;margin-bottom:4px;}
.summary-value{font-size:18px;font-weight:900;color:#111;}
.summary-unit{font-size:11px;color:#aaa;}

/* 走行リスト */
.ride-list{background:#fff;border-radius:12px;overflow:hidden;}
.ride-item{
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:0.5px solid #f0f0f0;
}
.ride-item:last-child{border-bottom:none;}
.ride-left{display:flex;flex-direction:column;gap:4px;}
.ride-num{font-size:12px;color:#aaa;}
.ride-time{font-size:15px;font-weight:700;color:#111;}
.ride-dist{font-size:12px;color:#8E8E93;}
.ride-right{text-align:right;}
.ride-fare{font-size:18px;font-weight:900;color:#111;}
.ride-extras{font-size:11px;color:#FF9500;margin-top:2px;}

/* テスト集計 */
.test-section{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:0;}
.test-title{font-size:12px;color:#8E8E93;padding:12px 16px 4px;letter-spacing:1px;}
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#f0f0f0;}
.test-cell{background:#fff;padding:12px 16px;text-align:center;}
.test-cell-label{font-size:11px;color:#aaa;margin-bottom:4px;}
.test-cell-value{font-size:18px;font-weight:900;color:#111;}
.test-cell-unit{font-size:11px;color:#aaa;}
.test-export-btn{width:100%;padding:12px 16px;background:#f5f5f5;border:none;border-top:0.5px solid #f0f0f0;
  color:#007AFF;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;text-align:center;}

.empty{
  text-align:center;padding:60px 20px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty-icon{font-size:48px;opacity:0.2;}
.empty-text{font-size:15px;color:#aaa;}
</style>
</head>
<body ontouchstart="">

<div class="appbar">
  <div class="appbar-back" onclick="location.href='settings.html'">＜</div>
  <div class="appbar-title">本日の走行履歴</div>
</div>

<div class="wrap" id="wrap">

  <!-- テスト集計（1週間） -->
  <div class="test-section" id="testSection" style="display:none;">
    <div class="test-title">📊 テスト集計（全期間）</div>
    <div class="test-grid" id="testGrid"></div>
    <button class="test-export-btn" onclick="exportTestCSV()">CSVエクスポート（Google Maps誤差検証）</button>
  </div>

  <div class="empty" id="emptyMsg">
    <div class="empty-icon">🚗</div>
    <div class="empty-text">本日の走行履歴はありません</div>
  </div>
</div>

<script>
// ─── テスト集計（1週間分）───
function loadTestStats(){
  const logs = JSON.parse(localStorage.getItem('daikou_test_logs') || '[]');
  if(logs.length === 0) return;

  const section = document.getElementById('testSection');
  const grid    = document.getElementById('testGrid');
  section.style.display = 'block';

  const totalTrips = logs.length;
  const totalDistM = logs.reduce((a,b) => a + (b.gps_distance_m||0), 0);
  const withPos    = logs.filter(l => l.start_pos && l.end_pos).length;
  const analyzed   = logs.filter(l => l.error_pct != null).length;
  const avgError   = analyzed > 0
    ? (logs.filter(l=>l.error_pct!=null).reduce((a,b)=>a+Math.abs(b.error_pct),0) / analyzed).toFixed(1)
    : '―';

  grid.innerHTML = `
    <div class="test-cell">
      <div class="test-cell-label">走行回数</div>
      <div class="test-cell-value">${totalTrips}<span class="test-cell-unit">回</span></div>
    </div>
    <div class="test-cell">
      <div class="test-cell-label">総走行距離</div>
      <div class="test-cell-value">${(totalDistM/1000).toFixed(1)}<span class="test-cell-unit">km</span></div>
    </div>
    <div class="test-cell">
      <div class="test-cell-label">座標取得済</div>
      <div class="test-cell-value">${withPos}<span class="test-cell-unit">件</span></div>
    </div>
    <div class="test-cell">
      <div class="test-cell-label">平均誤差</div>
      <div class="test-cell-value" style="color:${analyzed>0?'#007AFF':'#aaa'};">${avgError}<span class="test-cell-unit">${analyzed>0?'%':''}</span></div>
    </div>
  `;
}

// CSVエクスポート（Google Maps API連携）
async function exportTestCSV(){
  const logs = JSON.parse(localStorage.getItem('daikou_test_logs') || '[]');
  if(logs.length === 0){ alert('テストログがありません'); return; }

  // Google Maps API経由で真の距離取得（座標あり・未取得のもの）
  const toFetch = logs.filter(l => l.start_pos && l.end_pos && l.true_distance_m == null);
  if(toFetch.length > 0){
    const ok = confirm(`${toFetch.length}件のGoogle Maps距離を取得しますか？\n（時間がかかる場合があります）`);
    if(ok){
      let done = 0;
      for(const log of toFetch){
        try {
          const url = `/api/distance?from=${log.start_pos.lat},${log.start_pos.lng}&to=${log.end_pos.lat},${log.end_pos.lng}`;
          const res = await fetch(url);
          if(res.ok){
            const data = await res.json();
            log.true_distance_m = data.distance_m;
            log.true_distance_text = data.distance_text;
            if(log.true_distance_m > 0)
              log.error_pct = (log.gps_distance_m - log.true_distance_m) / log.true_distance_m * 100;
          }
        } catch(e){}
        done++;
        if(done % 5 === 0) alert(`取得中... ${done}/${toFetch.length}`);
        await new Promise(r => setTimeout(r, 100));
      }
      localStorage.setItem('daikou_test_logs', JSON.stringify(logs));
    }
  }

  // CSV生成
  const header = ['走行ID','開始時刻','終了時刻','アプリ距離(m)','Google Maps距離(m)','誤差(%)','開始座標','終了座標','Googleマップルート'];
  const rows = logs.map(l => [
    l.id, l.start_time, l.end_time||'',
    l.gps_distance_m,
    l.true_distance_m != null ? l.true_distance_m : '',
    l.error_pct != null ? l.error_pct.toFixed(2) : '',
    l.start_pos ? `${l.start_pos.lat},${l.start_pos.lng}` : '',
    l.end_pos   ? `${l.end_pos.lat},${l.end_pos.lng}`     : '',
    l.route_url || '',
  ]);
  const csv = [header, ...rows].map(r => r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `daikou_test_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);

  // 集計更新
  loadTestStats();
}

function load(){
  const today = new Date();
  const key = 'daikou_history_' + today.toDateString();
  const rides = JSON.parse(localStorage.getItem(key) || '[]');
  const wrap = document.getElementById('wrap');

  if(rides.length === 0) return;

  document.getElementById('emptyMsg').style.display = 'none';

  // 日付ヘッダー
  const days = ['日','月','火','水','木','金','土'];
  const dateStr = today.getFullYear() + '年' +
    (today.getMonth()+1) + '月' + today.getDate() + '日（' +
    days[today.getDay()] + '）';

  const dateHeader = document.createElement('div');
  dateHeader.className = 'date-header';
  dateHeader.textContent = dateStr;
  wrap.appendChild(dateHeader);

  // サマリー計算
  const totalDist = rides.reduce((a,b) => a + b.distance_m, 0);
  const totalFare = rides.reduce((a,b) => a + b.fare, 0);

  const summary = document.createElement('div');
  summary.className = 'summary-card';
  summary.innerHTML = `
    <div class="summary-item">
      <div class="summary-label">走行回数</div>
      <div class="summary-value">${rides.length}<span class="summary-unit">回</span></div>
    </div>
    <div class="summary-item">
      <div class="summary-label">総距離</div>
      <div class="summary-value">${(totalDist/1000).toFixed(1)}<span class="summary-unit">km</span></div>
    </div>
    <div class="summary-item">
      <div class="summary-label">総売上</div>
      <div class="summary-value" style="color:#007AFF;">¥${totalFare.toLocaleString()}</div>
    </div>
  `;
  wrap.appendChild(summary);

  // 走行リスト
  const list = document.createElement('div');
  list.className = 'ride-list';

  rides.forEach((ride, i) => {
    const item = document.createElement('div');
    item.className = 'ride-item';

    // 追加料金テキスト
    let extrasText = '';
    if(ride.extras && ride.extras.length > 0){
      extrasText = ride.extras.map(e => e.name + ' +¥' + e.amount.toLocaleString()).join('　');
    }
    if(ride.surcharge) extrasText = (extrasText ? extrasText + '　' : '') + '割増あり';

    item.innerHTML = `
      <div class="ride-left">
        <div class="ride-num">${i+1}回目</div>
        <div class="ride-time">${ride.time}</div>
        <div class="ride-dist">${(ride.distance_m/1000).toFixed(2)}km</div>
        ${extrasText ? `<div class="ride-extras">${extrasText}</div>` : ''}
      </div>
      <div class="ride-right">
        <div class="ride-fare">¥${ride.fare.toLocaleString()}</div>
      </div>
    `;
    list.appendChild(item);
  });

  wrap.appendChild(list);
}

load();
loadTestStats();
</script>
</body>
</html>
