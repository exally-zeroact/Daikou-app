<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>設定</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <h1>⚙️ 設定</h1>
  <a href="index.html" style="color:var(--text2);font-size:13px;text-decoration:none;">← 戻る</a>
</div>

<div class="main">

  <!-- 料金設定 -->
  <div class="settings-section">
    <h2>💰 料金設定</h2>

    <div class="field">
      <label>初乗り料金（円）</label>
      <input type="number" id="base_fare" value="1300" min="0">
    </div>

    <div class="field">
      <label>初乗り距離（m）</label>
      <input type="number" id="base_distance_m" value="1000" min="1">
    </div>

    <div class="field">
      <label>加算料金（円）</label>
      <input type="number" id="add_fare" value="100" min="0">
    </div>

    <div class="field">
      <label>加算距離（m）</label>
      <input type="number" id="add_distance_m" value="420" min="1">
    </div>

    <button class="btn btn-start" onclick="saveConfig()" style="margin-top:8px">
      💾 保存する
    </button>
  </div>

  <!-- 料金プレビュー -->
  <div class="settings-section">
    <h2>📋 料金プレビュー</h2>
    <div id="preview-table" style="font-size:14px;color:var(--text2);line-height:2"></div>
  </div>

  <div id="save-msg" style="text-align:center;color:var(--accent);font-size:14px;display:none">
    ✅ 保存しました
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="js/gps.js"></script>
<script src="js/meter.js"></script>
<script src="js/firebase.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', async () => {
    // Firestoreから現在の料金設定を取得して表示
    const config = await FirebaseManager.getFareConfig();
    if (config) {
      document.getElementById('base_fare').value = config.base_fare;
      document.getElementById('base_distance_m').value = config.base_distance_m;
      document.getElementById('add_fare').value = config.add_fare;
      document.getElementById('add_distance_m').value = config.add_distance_m;
    }
    updatePreview();
  });

  // 入力変更時にプレビューを更新
  ['base_fare','base_distance_m','add_fare','add_distance_m'].forEach(id => {
    document.getElementById(id).addEventListener('input', updatePreview);
  });

  function getFormConfig() {
    return {
      base_fare: parseInt(document.getElementById('base_fare').value) || 1300,
      base_distance_m: parseInt(document.getElementById('base_distance_m').value) || 1000,
      add_fare: parseInt(document.getElementById('add_fare').value) || 100,
      add_distance_m: parseInt(document.getElementById('add_distance_m').value) || 420,
    };
  }

  function updatePreview() {
    const c = getFormConfig();
    Meter.setFareConfig(c);

    const rows = [];
    // 初乗り〜10km分のプレビュー
    const checkpoints = [0, c.base_distance_m];
    for (let m = c.base_distance_m + c.add_distance_m; m <= 10000; m += c.add_distance_m) {
      checkpoints.push(m);
    }
    checkpoints.forEach(m => {
      const fare = Meter.calcFare(m);
      const dist = m < 1000 ? `${m}m` : `${(m/1000).toFixed(2)}km`;
      rows.push(`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--bg3);padding:4px 0">
        <span>${dist}</span>
        <span style="color:var(--accent);font-weight:700">¥${fare.toLocaleString()}</span>
      </div>`);
    });
    document.getElementById('preview-table').innerHTML = rows.join('');
  }

  async function saveConfig() {
    const config = getFormConfig();
    const ok = await FirebaseManager.saveFareConfig(config);
    const msg = document.getElementById('save-msg');
    msg.style.display = 'block';
    msg.textContent = ok ? '✅ 保存しました' : '❌ 保存に失敗しました';
    setTimeout(() => { msg.style.display = 'none'; }, 3000);
  }
</script>

</body>
</html>
