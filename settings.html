<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>設定</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:#f5f5f5;color:#111;min-height:100vh;}
.appbar{background:#007AFF;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;}
.appbar-back{color:#fff;font-size:16px;cursor:pointer;padding:4px 8px;}
.appbar-title{font-size:17px;font-weight:700;color:#fff;}
.wrap{padding:16px;padding-bottom:80px;display:flex;flex-direction:column;gap:16px;}
.section{background:#fff;border-radius:12px;overflow:hidden;}
.section-title{font-size:12px;color:#8E8E93;padding:12px 16px 4px;letter-spacing:1px;}
.row{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:0.5px solid #f0f0f0;}
.row:last-child{border-bottom:none;}
.row-label{font-size:15px;color:#111;}
.row-input{width:120px;border:0.5px solid #ddd;border-radius:8px;padding:8px 10px;font-size:15px;text-align:right;font-family:'Noto Sans JP',sans-serif;background:#f9f9f9;}
.row-unit{font-size:13px;color:#8E8E93;margin-left:4px;}
.toggle{width:44px;height:26px;background:#ddd;border-radius:13px;position:relative;cursor:pointer;transition:background 0.2s;}
.toggle.on{background:#007AFF;}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:left 0.2s;}
.toggle.on::after{left:20px;}
.preview{background:#fff8f0;border-radius:8px;padding:12px;font-size:13px;color:#888;line-height:2.2;}
.preview span.val{color:#111;font-weight:700;}
.btn-save{width:100%;padding:16px;background:#007AFF;border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:900;letter-spacing:2px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;-webkit-transition:transform 0.1s,-webkit-filter 0.1s;transition:transform 0.1s,filter 0.1s;} .btn-save:active{-webkit-transform:scale(0.97);transform:scale(0.97);-webkit-filter:brightness(0.85);filter:brightness(0.85);}
.save-msg{text-align:center;color:#34C759;font-size:13px;min-height:20px;margin-top:4px;}

/* 追加料金リスト */
.extra-item{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:0.5px solid #f0f0f0;}
.extra-item:last-child{border-bottom:none;}
.extra-item-row{display:flex;align-items:center;gap:8px;}
.extra-name{flex:1;border:0.5px solid #ddd;border-radius:8px;padding:10px 12px;font-size:15px;font-family:'Noto Sans JP',sans-serif;}
.extra-amount{width:110px;border:0.5px solid #ddd;border-radius:8px;padding:10px 12px;font-size:15px;text-align:right;font-family:'Noto Sans JP',sans-serif;}
.extra-unit{font-size:13px;color:#8E8E93;white-space:nowrap;}
.extra-del{background:#FF3B30;border:none;border-radius:8px;padding:8px 14px;color:#fff;font-size:13px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;white-space:nowrap;}
.btn-add{width:100%;padding:12px;background:#f5f5f5;border:0.5px solid #ddd;border-radius:10px;color:#007AFF;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;margin-top:8px;}

/* 車両選択 */
.vehicle-select{width:100%;border:0.5px solid #ddd;border-radius:8px;padding:10px 12px;font-size:15px;background:#f9f9f9;font-family:'Noto Sans JP',sans-serif;}

/* 活動エリア（Map Matching）2026/04/30追加 */
.region-buttons{display:flex;gap:8px;padding:12px 16px 8px;flex-wrap:wrap;}
.region-btn{flex:1;min-width:90px;padding:10px 8px;background:#f0f7ff;border:0.5px solid #007AFF;border-radius:8px;color:#007AFF;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent;}
.region-btn:active{background:#dbeaff;}
.region-summary{padding:8px 16px;font-size:13px;color:#8E8E93;border-bottom:0.5px solid #f0f0f0;}
.region-summary .count{color:#007AFF;font-weight:700;}
.region-group{padding:0;}
.region-group-header{padding:10px 16px 6px;font-size:12px;color:#8E8E93;font-weight:700;background:#fafafa;border-bottom:0.5px solid #f0f0f0;letter-spacing:1px;}
.region-pref{display:flex;align-items:center;padding:11px 16px;border-bottom:0.5px solid #f5f5f5;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.region-pref:active{background:#f5f5f5;}
.region-pref input[type=checkbox]{margin-right:12px;width:20px;height:20px;accent-color:#007AFF;}
.region-pref-name{flex:1;font-size:15px;color:#111;}
.region-pref.checked .region-pref-name{font-weight:700;}
</style>
</head>
<body ontouchstart="">

<div class="appbar">
  <div class="appbar-back" onclick="location.href='index.html'">＜</div>
  <div class="appbar-title">設定</div>
</div>

<div class="wrap">

  <!-- 自動リセット設定 -->
  <div class="section">
    <div class="section-title">自動リセット</div>
    <div class="row">
      <div class="row-label">リセット時間</div>
      <div style="display:flex;align-items:center;gap:6px;">
        <input class="row-input" type="time" id="resetTime" value="12:00" style="width:110px;">
      </div>
    </div>
  </div>

  <!-- 料金設定 -->
  <div class="section">
    <div class="section-title">料金設定</div>
    <div class="row">
      <div class="row-label">初乗り料金</div>
      <div style="display:flex;align-items:center;">
        <input class="row-input" type="number" id="baseFare" value="1300">
        <span class="row-unit">円</span>
      </div>
    </div>
    <div class="row">
      <div class="row-label">加算開始距離<br><span style="font-size:11px;color:#aaa;">この距離から加算（例：1000mで¥1,400）</span></div>
      <div style="display:flex;align-items:center;">
        <input class="row-input" type="number" id="baseDist" value="1000">
        <span class="row-unit">m未満</span>
      </div>
    </div>
    <div class="row">
      <div class="row-label">加算距離</div>
      <div style="display:flex;align-items:center;">
        <input class="row-input" type="number" id="addDist" value="420">
        <span class="row-unit">mごと</span>
      </div>
    </div>
    <div class="row">
      <div class="row-label">加算金額</div>
      <div style="display:flex;align-items:center;">
        <input class="row-input" type="number" id="addFare" value="100">
        <span class="row-unit">円</span>
      </div>
    </div>
    <div style="padding:12px 16px;">
      <div class="preview" id="preview"></div>
    </div>
  </div>

  <!-- 割増設定 -->
  <div class="section">
    <div class="section-title">割増設定</div>
    <div class="row">
      <div class="row-label">割増ボタンを表示</div>
      <div class="toggle" id="surchargeToggle" onclick="toggleSurcharge()"></div>
    </div>
    <div class="row" id="surchargeRateRow" style="display:none;">
      <div class="row-label">割増率</div>
      <div style="display:flex;align-items:center;">
        <input class="row-input" type="number" id="surchargeRate" value="1.2" step="0.1" min="1.0">
        <span class="row-unit">倍</span>
      </div>
    </div>
  </div>

  <!-- 時間料金設定 -->
  <div class="section">
    <div class="section-title">時間料金（オプション）</div>
    <div class="row">
      <div class="row-label">時間料金を使用</div>
      <div class="toggle" id="timeToggle" onclick="toggleTime()"></div>
    </div>
    <div class="row" id="timeRateRow" style="display:none;">
      <div class="row-label">時間単価</div>
      <div style="display:flex;align-items:center;">
        <input class="row-input" type="number" id="timeRate" value="30">
        <span class="row-unit">円/分</span>
      </div>
    </div>
  </div>

  <!-- 追加料金項目 -->
  <div class="section">
    <div class="section-title">追加料金項目</div>
    <div id="extraItems"></div>
    <div style="padding:8px 16px 16px;">
      <button class="btn-add" onclick="addExtraItem()">＋ 項目を追加</button>
    </div>
  </div>

  <!-- 活動エリア（Map Matching・2026/04/30追加） -->
  <div class="section">
    <div class="section-title">活動エリア（Map Matching）</div>
    <div class="region-buttons">
      <button class="region-btn" onclick="regionAuto()">📍 現在地</button>
      <button class="region-btn" onclick="regionClear()">クリア</button>
    </div>
    <div class="region-summary">
      <span class="count" id="regionCount">0</span> 県選択中
      <span id="regionSize" style="margin-left:6px;color:#aaa;"></span>
    </div>
    <div id="regionList"></div>
    <div class="row" style="border-top:0.5px solid #f0f0f0;">
      <div class="row-label">自動判定も併用<br><span style="font-size:11px;color:#aaa;">県境を超えた時に現在地の県を自動追加</span></div>
      <div class="toggle" id="autoRegionToggle" onclick="toggleAutoRegion()"></div>
    </div>
  </div>

  <!-- ★テスト用・リリース時削除 -->
  <div class="section" id="testLinkSection">
    <div class="row" onclick="location.href='history.html'" style="cursor:pointer;">
      <div class="row-label">📊 走行履歴・テスト集計</div>
      <div style="color:#8E8E93;font-size:13px;">›</div>
    </div>
  </div>

  <button class="btn-save" onclick="saveAll()">保　存</button>
  <div class="save-msg" id="saveMsg"></div>

  <!-- 端末警告文 -->
  <p style="text-align:center;font-size:11px;color:#aaa;margin-top:16px;line-height:1.8;padding:0 8px;">
    古い機種や低価格端末ではGPS精度が<br>低下する場合があります
  </p>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase.js"></script>
<script>
let surchargeEnabled = false;
let timeEnabled = false;
let extraItems = [];

// 活動エリア（Map Matching・2026/04/30追加）
const REGION_GROUPS = [
  { name: '北海道', prefs: [['hokkaido','北海道']] },
  { name: '東北', prefs: [
    ['aomori','青森県'],['iwate','岩手県'],['miyagi','宮城県'],
    ['akita','秋田県'],['yamagata','山形県'],['fukushima','福島県']
  ]},
  { name: '関東', prefs: [
    ['ibaraki','茨城県'],['tochigi','栃木県'],['gunma','群馬県'],
    ['saitama','埼玉県'],['chiba','千葉県'],['tokyo','東京都'],['kanagawa','神奈川県']
  ]},
  { name: '中部', prefs: [
    ['niigata','新潟県'],['toyama','富山県'],['ishikawa','石川県'],
    ['fukui','福井県'],['yamanashi','山梨県'],['nagano','長野県'],
    ['gifu','岐阜県'],['shizuoka','静岡県'],['aichi','愛知県']
  ]},
  { name: '近畿', prefs: [
    ['mie','三重県'],['shiga','滋賀県'],['kyoto','京都府'],
    ['osaka','大阪府'],['hyogo','兵庫県'],['nara','奈良県'],['wakayama','和歌山県']
  ]},
  { name: '中国', prefs: [
    ['tottori','鳥取県'],['shimane','島根県'],['okayama','岡山県'],
    ['hiroshima','広島県'],['yamaguchi','山口県']
  ]},
  { name: '四国', prefs: [
    ['tokushima','徳島県'],['kagawa','香川県'],['ehime','愛媛県'],['kochi','高知県']
  ]},
  { name: '九州・沖縄', prefs: [
    ['fukuoka','福岡県'],['saga','佐賀県'],['nagasaki','長崎県'],
    ['kumamoto','熊本県'],['oita','大分県'],['miyazaki','宮崎県'],
    ['kagoshima','鹿児島県'],['okinawa','沖縄県']
  ]}
];
let selectedRegions = new Set();
let autoRegionEnabled = false;

function load(){
  FB.loadFareConfig(cfg=>{
    if(cfg.base_fare)       document.getElementById('baseFare').value = cfg.base_fare;
    if(cfg.base_distance_m) document.getElementById('baseDist').value  = cfg.base_distance_m;
    if(cfg.add_distance_m)  document.getElementById('addDist').value   = cfg.add_distance_m;
    if(cfg.add_fare)        document.getElementById('addFare').value    = cfg.add_fare;
    updatePreview();
  });
  const s = localStorage.getItem('daikou_settings');
  if(s){
    const obj = JSON.parse(s);
    surchargeEnabled = obj.surchargeEnabled || false;
    timeEnabled      = obj.timeEnabled      || false;
    if(obj.surchargeRate) document.getElementById('surchargeRate').value = obj.surchargeRate;
    if(obj.timeRate)      document.getElementById('timeRate').value      = obj.timeRate;
    if(obj.resetTime)     document.getElementById('resetTime').value      = obj.resetTime;
  }
  updateSurchargeUI();
  updateTimeUI();

  extraItems = JSON.parse(localStorage.getItem('daikou_extras')||'[]');
  // 初回起動時にデフォルトのクイック追加料金をセット
  if(localStorage.getItem('daikou_extras') === null){
    extraItems = [
      {name:'外車', amount:500},
      {name:'MT車', amount:500},
      {name:'左ハンドル', amount:1000},
      {name:'深夜割増', amount:1000},
      {name:'迎車料金', amount:1000},
      {name:'キャンセル料', amount:2000}
    ];
    localStorage.setItem('daikou_extras', JSON.stringify(extraItems));
  }
  renderExtraItems();
  updatePreview();

  // 活動エリア読み込み（2026/04/30追加）
  loadRegions();
  renderRegions();
}

// ─── 活動エリア（Map Matching）2026/04/30追加 ───
function loadRegions(){
  try {
    const saved = localStorage.getItem('daikou_user_regions');
    if(saved){
      const arr = JSON.parse(saved);
      if(Array.isArray(arr)) selectedRegions = new Set(arr);
    }
    autoRegionEnabled = localStorage.getItem('daikou_user_auto_region') === 'true';
  } catch(e){
    console.error('loadRegions error:', e);
  }
  updateAutoRegionUI();
}

function renderRegions(){
  const el = document.getElementById('regionList');
  let html = '';
  for(const group of REGION_GROUPS){
    html += '<div class="region-group">';
    html += '<div class="region-group-header">' + group.name + '</div>';
    for(const [key, name] of group.prefs){
      const checked = selectedRegions.has(key);
      html += '<label class="region-pref' + (checked ? ' checked' : '') + '" data-key="' + key + '">';
      html += '<input type="checkbox"' + (checked ? ' checked' : '') + ' onchange="toggleRegion(\'' + key + '\', this.checked)">';
      html += '<span class="region-pref-name">' + name + '</span>';
      html += '</label>';
    }
    html += '</div>';
  }
  el.innerHTML = html;
  updateRegionSummary();
}

function toggleRegion(key, checked){
  if(checked) selectedRegions.add(key);
  else selectedRegions.delete(key);
  // クラスも更新（太字表示）
  const label = document.querySelector('.region-pref[data-key="' + key + '"]');
  if(label) label.className = 'region-pref' + (checked ? ' checked' : '');
  updateRegionSummary();
}

function updateRegionSummary(){
  const count = selectedRegions.size;
  document.getElementById('regionCount').textContent = count;
  // データサイズ概算（県平均2MB）
  const sizeMB = count * 2;
  const sizeEl = document.getElementById('regionSize');
  if(count === 0){
    sizeEl.textContent = '';
  } else {
    sizeEl.textContent = '（約' + sizeMB + 'MB）';
  }
}

function regionAuto(){
  if(!navigator.geolocation){
    alert('位置情報が使えません');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const pref = nearestPrefecture(pos.coords.latitude, pos.coords.longitude);
      if(pref){
        selectedRegions.add(pref);
        renderRegions();
      } else {
        alert('現在地の都道府県を判定できませんでした');
      }
    },
    (err)=>{
      alert('位置情報取得失敗: ' + err.message);
    },
    { timeout: 10000, maximumAge: 60000 }
  );
}

function regionClear(){
  if(selectedRegions.size === 0) return;
  if(!confirm('全ての選択を解除しますか？')) return;
  selectedRegions.clear();
  renderRegions();
}

function toggleAutoRegion(){
  autoRegionEnabled = !autoRegionEnabled;
  updateAutoRegionUI();
}
function updateAutoRegionUI(){
  document.getElementById('autoRegionToggle').className = 'toggle' + (autoRegionEnabled ? ' on' : '');
}

// 都道府県判定（重心からの近傍・region-loader.js と同じロジック）
const PREFECTURES_CENTER = {
  hokkaido:[43.3,142.8],
  aomori:[40.8,140.7],iwate:[39.7,141.2],miyagi:[38.3,140.9],
  akita:[39.7,140.4],yamagata:[38.2,140.0],fukushima:[37.4,140.2],
  ibaraki:[36.4,140.4],tochigi:[36.7,139.9],gunma:[36.4,139.0],
  saitama:[35.9,139.4],chiba:[35.5,140.2],tokyo:[35.7,139.7],kanagawa:[35.4,139.4],
  niigata:[37.5,138.9],toyama:[36.6,137.2],ishikawa:[36.6,136.7],
  fukui:[35.8,136.2],yamanashi:[35.6,138.6],nagano:[36.2,138.0],
  gifu:[35.6,137.0],shizuoka:[34.9,138.4],aichi:[35.1,137.0],
  mie:[34.6,136.5],shiga:[35.1,136.1],kyoto:[35.2,135.7],
  osaka:[34.6,135.5],hyogo:[35.0,134.9],nara:[34.4,135.8],wakayama:[33.8,135.5],
  tottori:[35.4,134.0],shimane:[35.0,132.8],okayama:[34.9,133.8],
  hiroshima:[34.5,132.7],yamaguchi:[34.2,131.6],
  tokushima:[33.9,134.4],kagawa:[34.3,134.0],ehime:[33.7,132.9],kochi:[33.5,133.5],
  fukuoka:[33.6,130.7],saga:[33.3,130.1],nagasaki:[32.9,129.9],
  kumamoto:[32.7,130.7],oita:[33.2,131.4],miyazaki:[32.0,131.4],
  kagoshima:[31.4,130.6],okinawa:[26.5,128.0]
};
function nearestPrefecture(lat, lng){
  let best = null, bestDist = Infinity;
  for(const pref in PREFECTURES_CENTER){
    const c = PREFECTURES_CENTER[pref];
    const dLat = lat - c[0], dLng = lng - c[1];
    const d = dLat*dLat + dLng*dLng;
    if(d < bestDist){ bestDist = d; best = pref; }
  }
  return best;
}

// 料金プレビュー
['baseFare','baseDist','addDist','addFare'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updatePreview);
});

function updatePreview(){
  const bf = parseInt(document.getElementById('baseFare').value)||1300;
  const bd = parseInt(document.getElementById('baseDist').value)||1000;
  const ad = parseInt(document.getElementById('addDist').value)||420;
  const af = parseInt(document.getElementById('addFare').value)||100;
  let html = '';
  html += `<span style="color:#aaa;">0m 〜 ${bd-1}m</span>　→　<span class="val">¥${bf.toLocaleString()}</span><br>`;
  for(let i=0; i<6; i++){
    const from = bd + ad * i;
    const to   = bd + ad * (i+1) - 1;
    const fare = bf + (i+1) * af;
    html += `<span style="color:#aaa;">${from}m 〜 ${to}m</span>　→　<span class="val">¥${fare.toLocaleString()}</span><br>`;
  }
  document.getElementById('preview').innerHTML=html;
}

function toggleSurcharge(){
  surchargeEnabled=!surchargeEnabled;
  updateSurchargeUI();
}
function updateSurchargeUI(){
  document.getElementById('surchargeToggle').className='toggle'+(surchargeEnabled?' on':'');
  document.getElementById('surchargeRateRow').style.display=surchargeEnabled?'flex':'none';
}

function toggleTime(){
  timeEnabled=!timeEnabled;
  updateTimeUI();
}
function updateTimeUI(){
  document.getElementById('timeToggle').className='toggle'+(timeEnabled?' on':'');
  document.getElementById('timeRateRow').style.display=timeEnabled?'flex':'none';
}

function renderExtraItems(){
  const el=document.getElementById('extraItems');
  el.innerHTML=extraItems.map((item,i)=>`
    <div class="extra-item">
      <input class="extra-name" type="text" value="${item.name}" placeholder="項目名（例：高速料金A）"
        oninput="extraItems[${i}].name=this.value">
      <div class="extra-item-row">
        <input class="extra-amount" type="number" value="${item.amount||''}" placeholder="0"
          inputmode="numeric"
          oninput="extraItems[${i}].amount=parseInt(this.value)||0">
        <span class="extra-unit">円</span>
        <button class="extra-del" onclick="removeExtra(${i})">削除</button>
      </div>
    </div>
  `).join('');
}

function addExtraItem(){
  extraItems.push({name:'',amount:0});
  renderExtraItems();
}

function removeExtra(i){
  extraItems.splice(i,1);
  renderExtraItems();
}

function saveAll(){
  try {
    const cfg={
      base_fare:      parseInt(document.getElementById('baseFare').value)||1300,
      base_distance_m:parseInt(document.getElementById('baseDist').value)||1000,
      add_distance_m: parseInt(document.getElementById('addDist').value)||420,
      add_fare:       parseInt(document.getElementById('addFare').value)||100,
    };

    // localStorage保存を先に実行（Firebaseより優先）
    const settings={
      vehicleId:        'v1',
      surchargeEnabled: surchargeEnabled,
      surchargeRate:    parseFloat(document.getElementById('surchargeRate').value)||1.2,
      timeEnabled:      timeEnabled,
      timeRate:         parseInt(document.getElementById('timeRate').value)||30,
      baseFare:         cfg.base_fare,
      baseDistanceM:    cfg.base_distance_m,
      addDistanceM:     cfg.add_distance_m,
      addFare:          cfg.add_fare,
    };
    settings.resetTime = document.getElementById('resetTime').value || '12:00';
    localStorage.setItem('daikou_settings', JSON.stringify(settings));
    localStorage.setItem('daikou_extras',   JSON.stringify(extraItems));

    // 活動エリア保存（2026/04/30追加）
    localStorage.setItem('daikou_user_regions', JSON.stringify(Array.from(selectedRegions)));
    localStorage.setItem('daikou_user_auto_region', autoRegionEnabled ? 'true' : 'false');

    // Firebase保存（失敗しても続行）
    try { FB.saveFareConfig(cfg); } catch(e){ console.error('Firebase save error:', e); }

    setTimeout(()=>{ location.href='index.html'; }, 500);
  } catch(e){
    console.error('saveAll error:', e);
    alert('保存に失敗しました: ' + e.message);
  }
}

load();
</script>
</body>
</html>
