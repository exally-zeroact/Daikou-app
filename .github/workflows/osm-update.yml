
name: OSM Roads Auto Update

# ===============================================================
# ダイコメ Map Matching用 道路データ自動生成
# 毎週日曜 03:00 JST に Geofabrik から最新OSM取得 → roads-<region>.js
# 初回は手動実行（workflow_dispatch）でテスト
# ===============================================================

on:
  schedule:
    # JST 03:00 = UTC 18:00 (前日土曜)
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      region:
        description: '対象地方（テスト用に1地方ずつ実行可能）'
        required: true
        default: 'shikoku'
        type: choice
        options:
          - shikoku
          - hokkaido
          - tohoku
          - kanto
          - chubu
          - kansai
          - chugoku
          - kyushu
          - all

# 同時実行を1つに制限（重複コミット防止）
concurrency:
  group: osm-update
  cancel-in-progress: false

# Actionsがリポジトリへcommitできるよう書込権限を付与
permissions:
  contents: write

jobs:
  build-roads:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        region:
          - ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.region || 'all' }}

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: osmium-toolインストール
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 処理対象地方リスト決定
        id: regions
        run: |
          INPUT="${{ matrix.region }}"
          if [ "$INPUT" = "all" ]; then
            echo "list=hokkaido tohoku kanto chubu kansai chugoku shikoku kyushu" >> $GITHUB_OUTPUT
          else
            echo "list=$INPUT" >> $GITHUB_OUTPUT
          fi
          echo "対象: $INPUT"

      - name: OSMデータDL & 道路抽出 & JS化
        env:
          REGIONS: ${{ steps.regions.outputs.list }}
        run: |
          set -e
          mkdir -p tmp data

          for REGION in $REGIONS; do
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "▶ ${REGION} 処理開始"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            URL="https://download.geofabrik.de/asia/japan/${REGION}-latest.osm.pbf"
            PBF="tmp/${REGION}.osm.pbf"
            FILTERED="tmp/${REGION}-roads.osm.pbf"
            GEOJSON="tmp/${REGION}-roads.geojson"

            # 1. ダウンロード（タイムアウト10分）
            echo "  [1/4] DL: $URL"
            curl -fsSL --max-time 600 -o "$PBF" "$URL"
            ls -lh "$PBF"

            # 2. 道路だけ抽出（highway=*タグ）
            echo "  [2/4] 道路抽出"
            osmium tags-filter "$PBF" w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link \
              -o "$FILTERED" --overwrite

            # 3. GeoJSONへ変換
            echo "  [3/4] GeoJSON変換"
            osmium export "$FILTERED" -o "$GEOJSON" --overwrite -f geojson

            # 4. JS化（デルタ圧縮込み）
            echo "  [4/4] JS化"
            node scripts/build-roads.js "$GEOJSON" "data/roads-${REGION}.js" "$REGION"

            ls -lh "data/roads-${REGION}.js"
            rm -f "$PBF" "$FILTERED" "$GEOJSON"
            echo "✅ ${REGION} 完了"
          done

      - name: 変更検出
        id: diff
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 変更あり"
            git status --short data/
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ 変更なし（コミットスキップ）"
          fi

      - name: 自動コミット & プッシュ
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roads-*.js
          git commit -m "chore(roads): OSM自動更新 $(date -u +'%Y-%m-%d') [skip ci]"
          git push

      - name: 失敗時のサマリ
        if: failure()
        run: |
          echo "::error::OSM更新失敗。GitHubから通知メールが届きます。"
          echo "前週の data/roads-*.js は残っているのでアプリは継続動作します。"
