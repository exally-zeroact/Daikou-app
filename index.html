<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>代行メーター</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="header">
  <h1>⚡ 代行メーター</h1>
  <span id="status-badge" class="badge idle">空車</span>
</div>

<div class="main">

  <!-- 車両選択 -->
  <div class="status-row">
    <div class="vehicle-select-row">
      <span>車両：</span>
      <select id="vehicle-select">
        <option value="v1">1号車</option>
        <option value="v2">2号車</option>
        <option value="v3">3号車</option>
        <option value="v4">4号車</option>
      </select>
    </div>
    <a href="settings.html" style="color:var(--text2);font-size:13px;text-decoration:none;">⚙️ 設定</a>
  </div>

  <!-- 料金表示 -->
  <div class="fare-card">
    <div class="fare-label">料　金</div>
    <div class="fare-amount" id="fare">¥1,300</div>
    <div class="fare-unit">円</div>
  </div>

  <!-- 距離・時間 -->
  <div class="info-grid">
    <div class="info-card">
      <div class="label">走行距離</div>
      <div class="value" id="distance">0m</div>
    </div>
    <div class="info-card">
      <div class="label">経過時間</div>
      <div class="value" id="elapsed">00:00</div>
    </div>
  </div>

  <!-- GPS・接続状態 -->
  <div class="status-row">
    <span id="gps-accuracy" style="color:var(--text2)">GPS 待機中...</span>
    <span id="stationary">--</span>
  </div>
  <div class="status-row">
    <span>通信</span>
    <span id="connection">🔴 確認中...</span>
  </div>

  <!-- スタート/ストップボタン -->
  <button id="main-btn" class="btn btn-start" onclick="handleMainBtn()">
    🚗 走行開始
  </button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="js/gps.js"></script>
<script src="js/meter.js"></script>
<script src="js/firebase.js"></script>
<script src="js/ui.js"></script>

<script>
  let vehicleId = 'v1';
  let isRunning = false;
  let lastGpsResult = null;
  let dbUpdateInterval = null;

  // 初期化
  window.addEventListener('DOMContentLoaded', async () => {
    // 保存済み車両IDを復元
    const saved = localStorage.getItem('daiko_vehicle');
    if (saved) {
      document.getElementById('vehicle-select').value = saved;
      vehicleId = saved;
    }

    document.getElementById('vehicle-select').addEventListener('change', e => {
      vehicleId = e.target.value;
      localStorage.setItem('daiko_vehicle', vehicleId);
    });

    // Firestoreから料金設定を取得
    const config = await FirebaseManager.getFareConfig();
    if (config) {
      Meter.setFareConfig(config);
      console.log('[Meter] fare config loaded from Firestore:', config);
    }

    // 接続状態を定期確認
    setInterval(() => {
      UI.updateConnectionStatus(FirebaseManager.getConnectionStatus());
    }, 2000);

    // GPS開始（精度取得のため事前に起動）
    GPS.start(onGpsUpdate);
  });

  function onGpsUpdate(result) {
    lastGpsResult = result;

    // 走行中のみメーター更新
    if (isRunning) {
      Meter.update(result);
    }

    // UI更新
    UI.updateMainUI(Meter.getState(), result);

    // Firebaseに位置情報を送信（走行中のみ）
    if (isRunning) {
      FirebaseManager.updateLocation(vehicleId, result.lat, result.lng);
    }
  }

  function handleMainBtn() {
    if (!isRunning) {
      startDriving();
    } else {
      stopDriving();
    }
  }

  function startDriving() {
    isRunning = true;
    Meter.start();

    // ボタン切り替え
    const btn = document.getElementById('main-btn');
    btn.textContent = '🛑 走行終了';
    btn.className = 'btn btn-stop';

    // Firebase更新開始
    FirebaseManager.updateStatus(vehicleId, 'driving');
    dbUpdateInterval = setInterval(() => {
      const s = Meter.getState();
      FirebaseManager.updateSession(vehicleId, {
        distance_m: Math.round(s.distance_m),
        fare_yen: s.fare_yen,
        elapsed_sec: s.elapsed_sec,
      });
    }, 2000); // 2秒ごとにDBへ送信
  }

  async function stopDriving() {
    isRunning = false;
    const finalState = Meter.getState();
    Meter.stop();

    // インターバル停止
    if (dbUpdateInterval) {
      clearInterval(dbUpdateInterval);
      dbUpdateInterval = null;
    }

    // Firebase最終更新
    await FirebaseManager.updateStatus(vehicleId, 'finished');
    await FirebaseManager.updateSession(vehicleId, {
      distance_m: Math.round(finalState.distance_m),
      fare_yen: finalState.fare_yen,
      elapsed_sec: finalState.elapsed_sec,
    });

    // 走行ログ保存（Firestore）
    await FirebaseManager.saveSessionLog(vehicleId, finalState, Meter.getFareConfig());

    // ボタン切り替え
    const btn = document.getElementById('main-btn');
    btn.textContent = '🚗 走行開始';
    btn.className = 'btn btn-start';

    // バッジを空車に
    const badge = document.getElementById('status-badge');
    badge.textContent = '空車';
    badge.className = 'badge idle';

    // 確認アラート
    alert(`走行終了\n距離：${UI.formatDistance(finalState.distance_m)}\n時間：${UI.formatTime(finalState.elapsed_sec)}\n料金：¥${UI.formatFare(finalState.fare_yen)}`);

    // Firebase を idle に戻す（少し待ってから）
    setTimeout(() => {
      FirebaseManager.updateStatus(vehicleId, 'idle');
    }, 10000);
  }
</script>

</body>
</html>
